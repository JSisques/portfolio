name: Preview

# One Cloudflare Worker Preview per pull request (ADR-0021, ADR-0035), deleted when
# the pull request closes. Previews use the `previews` block of wrangler.jsonc and
# never inherit production settings.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Previews live on a separate Worker. The `preview` environment holds a token
# scoped to that Worker only, so pull request code cannot deploy production.
env:
  PREVIEW_WORKER: jsisques-net-preview

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy preview
    # Secrets are unavailable to forked pull requests.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create or update Preview
        id: preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          output=$(pnpm exec wrangler preview --worker-name "$PREVIEW_WORKER" --name "pr-$PR_NUMBER" --tag "${HEAD_SHA:0:7}" --json)
          printf '%s\n' "$output"
          url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          body=$(printf '<!-- cloudflare-preview -->\nPreview: %s\n\nCommit: %s\n' "$PREVIEW_URL" "$HEAD_SHA")
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- cloudflare-preview -->"))) | .id' | head -n1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$body"
          fi

  cleanup:
    runs-on: ubuntu-latest
    name: Delete preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete Preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if ! output=$(pnpm exec wrangler preview delete --worker-name "$PREVIEW_WORKER" --name "pr-$PR_NUMBER" --skip-confirmation 2>&1); then
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qi "not found"; then
              echo "::notice::Preview pr-$PR_NUMBER does not exist; nothing to delete."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$output"
