name: Deploy

# Production deploys only released code (ADR-0012): the pushed `v*` tag, or the
# latest published release on the daily rebuild (ADR-0005). Never `main` HEAD.
on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    name: Resolve release tag
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! out=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>&1); then
            if printf '%s' "$out" | grep -qi "release not found"; then
              echo "::notice::No published release yet; nothing to deploy."
              exit 0
            fi
            printf '%s\n' "$out"
            exit 1
          fi
          echo "tag=$out" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    name: Deploy production
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: pnpm exec wrangler deploy --tag "$TAG" --message "Release $TAG"
